plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.serialport'
version = '0.1.1'

repositories {
  maven { url 'https://jitpack.io' }
}

android {
  namespace "expo.modules.serialport"
  defaultConfig {
    versionCode 2
    versionName "0.1.1"
    minSdkVersion 24
  }
  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.github.mik3y:usb-serial-for-android:3.12.0'
  testImplementation 'junit:junit:4.13.2'
}
