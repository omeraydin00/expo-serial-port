name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run lint
      - run: npx jest

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm ci
        working-directory: example
      - run: npx expo prebuild -p android --no-install
        working-directory: example
      - name: Unit tests and example build
        working-directory: example/android
        run: ./gradlew :omeraydin00-expo-serial-port:testDebugUnitTest :app:assembleDebug -PreactNativeArchitectures=x86_64
